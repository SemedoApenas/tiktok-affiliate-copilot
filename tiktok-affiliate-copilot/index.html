<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiloto de Afiliado TikTok</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Copiloto de Afiliado TikTok</h1>
    <p class="subtitle">Cadastro de produtos candidatos de afiliação</p>
  </header>

  <main>
    <section class="form-section">
      <h2 id="form-title">Novo produto</h2>
      <form id="product-form" novalidate>
        <input type="hidden" id="product-id">

        <div class="field">
          <label for="nome">Nome *</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Fone de ouvido X" required>
          <span class="error" id="erro-nome"></span>
        </div>

        <div class="field">
          <label for="categoria">Categoria *</label>
          <input type="text" id="categoria" name="categoria" placeholder="Ex: Eletrônicos" required>
          <span class="error" id="erro-categoria"></span>
        </div>

        <div class="field">
          <label for="link">Link</label>
          <input type="url" id="link" name="link" placeholder="https://...">
        </div>

        <div class="field">
          <label for="comissaoPercent">Comissão (%)</label>
          <input type="number" id="comissaoPercent" name="comissaoPercent" min="0" max="100" step="0.01" placeholder="Ex: 15">
        </div>

        <div class="field">
          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" min="0" step="0.01" placeholder="Ex: 49.90">
        </div>

        <div class="field field-full">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" name="observacoes" rows="3" placeholder="Notas livres sobre o produto"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn">Adicionar produto</button>
          <button type="button" id="cancel-edit-btn" class="secondary" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <h2>Produtos cadastrados (<span id="product-count">0</span>)</h2>
      <div id="product-list" class="product-list"></div>
      <p id="empty-state" class="empty-state">Nenhum produto cadastrado ainda.</p>
    </section>

    <section class="comparativo-section">
      <button type="button" id="comparativo-toggle" class="btn-toggle-roteiros">▸ Comparativo de resultados (0)</button>
      <div id="comparativo-container" hidden></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
